[project]
name = "zaomeng-hanghai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fpc", email = "fupcode@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydist",
    "numpy",
    "pillow",
    "matplotlib",
    "opencv-python",
    "onnxruntime",
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.82",
    "pywin32",
    "dxcam[cv2,winrt]",
    "scipy",
    "ultralytics>=8.4.184",
    "torch>=2.10",
    "torchvision>=0.25",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "zaomeng_hanghai._maze_native"
features = ["pyo3/extension-module"]
exclude = ["**/*.pdb"]

[tool.uv.sources]
pydist = { git = "ssh://git@github.com/fupcode/pydist.git" }
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
