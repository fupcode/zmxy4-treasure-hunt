[project]
name = "zmxy4-treasure-hunt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "fpc", email = "fupcode@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python",
    "onnxruntime",
    "pywin32",
    "dxcam[cv2,winrt]",
    "scipy",
]

[dependency-groups]
debug = ["matplotlib"]
build = ["pyinstaller>=6"]
train = [
    "pyyaml>=5.3.1",
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.82",
    "ultralytics>=8.4.184",
    "torch>=2.10",
    "torchvision>=0.25",
]

[project.entry-points."pyinstaller40"]
hook-dirs = "zmxy4_treasure_hunt._pyinstaller:get_hook_dirs"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "zmxy4_treasure_hunt._native"
features = ["pyo3/extension-module"]
exclude = ["**/*.pdb"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
